---
layout: default
title: Playlists
permalink: /playlists/
---

<style>
  .page-content .wrapper { max-width: 960px; }

  body { background: #121212; }

  .site-header { background: #0f0f0f; border-top-color: #1db954; border-bottom-color: #282828; }
  .site-header .site-title { color: #fff; }
  .site-header .site-nav .page-link { color: #b3b3b3; }
  .site-header .site-nav .page-link:hover { color: #fff; }
  .site-header .extras-toggle { border-color: #282828; }
  .site-header .extras-toggle svg { fill: #b3b3b3; }
  .site-header .extras-dropdown { background: #181818; border-color: #282828; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .site-header .extras-dropdown a { color: #b3b3b3; }
  .site-header .extras-dropdown a:hover { background: #242424; color: #fff; }

  .playlists-heading { margin: 8px 0 24px; }
  .playlists-heading .eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #1db954; margin: 0 0 6px; }
  .playlists-heading h1 { font-size: 32px; font-weight: 700; margin: 0 0 4px; color: #fff; }
  .playlists-heading .sub { color: #b3b3b3; margin: 0; font-size: 14px; }

  .playlists-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
  .playlists-grid .card { background: #181818; border-radius: 8px; padding: 14px; transition: background 0.2s; }
  .playlists-grid .card:hover { background: #282828; }
  .playlists-grid .card-title { font-size: 15px; font-weight: 700; margin: 0 0 4px; color: #fff; }
  .playlists-grid .card-title a { color: #fff; text-decoration: none; }
  .playlists-grid .card-title a:hover { color: #1db954; }
  .playlists-grid .card-desc { font-size: 13px; color: #b3b3b3; margin: 0 0 10px; }
  .playlists-grid iframe { border-radius: 6px; }

  .site-footer { border-top-color: #282828; }
  .site-footer .footer-text { color: #828282; }
</style>

<div class="playlists-heading">
  <p class="eyebrow">Music</p>
  <h1>Playlists</h1>
  <p class="sub">O que está tocando em casa e no trabalho.</p>
</div>

<div class="playlists-grid">
  {%- for playlist in site.data.playlists -%}
    <div class="card">
      <p class="card-title"><a href="https://open.spotify.com/playlist/{{ playlist.id }}" target="_blank" rel="noopener">{{ playlist.name }}</a></p>
      <p class="card-desc">Abrir no Spotify</p>
      <iframe
        src="https://open.spotify.com/embed/playlist/{{ playlist.id }}?utm_source=generator&theme=0"
        width="100%"
        height="352"
        frameBorder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>
    </div>
  {%- endfor -%}
</div>
