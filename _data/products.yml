# Shop catalog for /shop/ (A loja).
# Each entry is one item for sale. Add new items with the `/new-item` command and
# retire sold ones with `/sold-item`, or edit by hand following this shape:
#
#   - id: unique-slug          # used in the URL hash (#unique-slug), keep it short
#     family: Fones de ouvido  # groups items into filter chips (reuse existing names)
#     title: AirPods 4 com ANC
#     condition: usado         # novo | usado
#     price: 1200              # selling price, plain number (BRL)
#     original: 1899           # optional list/original price for the strikethrough; omit if none
#     short: One-line summary shown on the list layout.
#     notes: Your personal notes about the item (Minhas notas).
#     vendor: Manufacturer-style description (Descrição do fabricante).
#     specs:                   # spec rows, [label, value]
#       - ["Tipo", "In-ear ANC"]
#     images: []               # optional photo paths, e.g. ["/files/images/shop/ip14-1.jpg"]

