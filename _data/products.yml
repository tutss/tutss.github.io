# Shop catalog for /shop/ (A loja).
# Each entry is one item for sale. Add new items with the `/new-item` command,
# or by hand following this shape:
#
#   - id: unique-slug          # used in the URL hash (#unique-slug), keep it short
#     family: iPhones          # groups items into filter chips (reuse existing names)
#     title: iPhone 14 128GB
#     condition: novo          # novo | usado
#     price: 3990              # selling price, plain number (BRL)
#     original: 4499           # optional list/original price for the strikethrough; omit if none
#     short: One-line summary shown on the list layout.
#     notes: Your personal notes about the item (Minhas notas).
#     vendor: Manufacturer-style description (Descrição do fabricante).
#     specs:                   # spec rows, [label, value]
#       - ["Armazenamento", "128 GB"]
#     images: []               # optional photo paths, e.g. ["/files/images/shop/ip14-1.jpg"]

